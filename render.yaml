services:
  # Backend - FastAPI Web Service
  - type: web
    name: mdefender-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicicornWorker -b 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: mdefender_pro
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_ALERTS
        value: "False"

  # Frontend - Static Site (React SPA)
  - type: static_site
    name: mdefender-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPPORT_PHONE
        value: "+8801715044575"

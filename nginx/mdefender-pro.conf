# ==============================================================================
# MDefender Pro - Nginx Cloud WAF Edge & High-Performance CDN Configuration
# ==============================================================================

# Cloudflare-style Edge Static Asset Cache Zone (50MB RAM keys, 5GB storage)
proxy_cache_path /var/cache/nginx/mdefender levels=1:2 keys_zone=mdef_cache:50m max_size=5g inactive=7d use_temp_path=off;

# Note: upstream mdefender_backend is defined in /etc/nginx/conf.d/00-mdefender-upstream.conf

# 1. Management Dashboard & API (HTTP -> HTTPS Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name mdefender-pro.crafix.tech;

    # ACME Challenge verification for automated Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1.1 Management Dashboard & API (HTTPS)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name mdefender-pro.crafix.tech;

    ssl_certificate /etc/letsencrypt/live/mdefender-pro.crafix.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdefender-pro.crafix.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/Mdefender-Pro/frontend/dist;
    index index.html;

    # Gzip Compression for Dashboard Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # API Endpoints
    location /api/ {
        proxy_pass http://mdefender_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Turnstile / Bot challenge endpoints
    location /__mdefender/ {
        proxy_pass http://mdefender_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA Frontend Dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Cloud WAF Edge Reverse Proxy (Default Catch-All for Protected Customer Domains)
# Any request for mahabubur.shop or custom domains passes through MDefender WAF
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/certs/mdefender-edge.crt;
    ssl_certificate_key /etc/ssl/private/mdefender-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # High-Performance TCP Socket Tuning
    client_max_body_size 100M;
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Edge Gzip Compression (Reduces HTML/CSS/JS payload sizes by up to 75%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # ACME Challenge verification for automated Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Cloudflare-style Edge Static Asset Cache (Images, CSS, JS, Fonts serve in < 2ms)
    # Cloudflare-style Edge Static Asset Cache (Images, CSS, JS, Fonts serve in < 2ms)
    location ~* \.(?:jpg|jpeg|gif|png|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        proxy_pass http://mdefender_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MDefender-Cloud-WAF "active";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Edge CDN Cache
        proxy_cache mdef_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-MDefender-Cache $upstream_cache_status always;
        add_header X-Edge-Protected "MDefender-Pro AI" always;
        add_header X-Edge-Upstream-Time $upstream_response_time always;
        add_header X-Edge-Request-Time $request_time always;
        expires 7d;
    }

    # Smart Cache Bypass Logic (WordPress Logged-in Users, Carts, Admin, POSTs, Query Strings)
    set $mdef_skip_cache 0;
    if ($request_method = POST) {
        set $mdef_skip_cache 1;
    }
    if ($query_string != "") {
        set $mdef_skip_cache 1;
    }
    if ($request_uri ~* "(/wp-admin/|/wp-login.php|/xmlrpc.php|/cart/|/checkout/|/my-account/|/wc-api/)") {
        set $mdef_skip_cache 1;
    }
    if ($http_cookie ~* "(comment_author|wordpress_logged_in|woocommerce_items_in_cart|wp-postpass)") {
        set $mdef_skip_cache 1;
    }

    # Dynamic Pages & Live Threat Inspection - Edge Micro-Cache (< 5ms response)
    location / {
        proxy_pass http://mdefender_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MDefender-Cloud-WAF "active";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;

        # Edge HTML Micro-Cache
        proxy_cache mdef_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $mdef_skip_cache;
        proxy_no_cache $mdef_skip_cache;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_revalidate on;

        add_header X-MDefender-Cache $upstream_cache_status always;
        add_header X-Edge-Protected "MDefender-Pro AI" always;
        add_header X-Edge-Upstream-Time $upstream_response_time always;
        add_header X-Edge-Request-Time $request_time always;

        # Fast buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

# Automated zero-touch custom domain configurations
include /etc/nginx/conf.d/domains/*.conf;

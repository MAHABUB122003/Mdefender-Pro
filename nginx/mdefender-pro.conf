# ==============================================================================
# MDefender Pro - Nginx Cloud WAF Edge & High-Performance CDN Configuration
# ==============================================================================

# Cloudflare-style Edge Static Asset Cache Zone (50MB RAM keys, 5GB storage)
proxy_cache_path /var/cache/nginx/mdefender levels=1:2 keys_zone=mdef_cache:50m max_size=5g inactive=7d use_temp_path=off;

# 1. Management Dashboard & API
server {
    listen 80;
    server_name mdefender-pro.crafix.tech;

    root /var/www/Mdefender-Pro/frontend/dist;
    index index.html;

    # Gzip Compression for Dashboard Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Turnstile / Bot challenge endpoints
    location /__mdefender/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA Frontend Dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Cloud WAF Edge Reverse Proxy (Default Catch-All for Protected Customer Domains)
# Any request for mahabubur.shop or custom domains passes through MDefender WAF
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/mdefender-edge.crt;
    ssl_certificate_key /etc/ssl/private/mdefender-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # High-Performance TCP Socket Tuning
    client_max_body_size 100M;
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Edge Gzip Compression (Reduces HTML/CSS/JS payload sizes by up to 75%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Cloudflare-style Edge Static Asset Cache (Images, CSS, JS, Fonts serve in < 2ms)
    location ~* \.(?:jpg|jpeg|gif|png|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MDefender-Cloud-WAF "active";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Edge CDN Cache
        proxy_cache mdef_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-MDefender-Cache $upstream_cache_status;
        add_header X-Edge-Protected "MDefender-Pro AI";
        expires 7d;
    }

    # Dynamic Pages & Live Threat Inspection
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MDefender-Cloud-WAF "active";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;

        # Fast buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

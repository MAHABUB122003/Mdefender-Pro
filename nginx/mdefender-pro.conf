# ==============================================================================
# MDefender Pro - Nginx Cloud WAF Edge & Dashboard Configuration
# ==============================================================================

# 1. Management Dashboard & API
server {
    listen 80;
    server_name mdefender-pro.crafix.tech;

    root /var/www/Mdefender-Pro/frontend/dist;
    index index.html;

    # API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Turnstile / Bot challenge endpoints
    location /__mdefender/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Frontend Dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Cloud WAF Edge Reverse Proxy (Default Catch-All for Protected Customer Domains)
# Any request for mahabubur.shop or custom domains passes through MDefender WAF
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/mdefender-edge.crt;
    ssl_certificate_key /etc/ssl/private/mdefender-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MDefender-Cloud-WAF "active";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }
}

services:
  mdefender-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DNS_SERVER_ENABLED=false
    restart: unless-stopped

  mdefender-dns:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "src.services.dns_server"]
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
